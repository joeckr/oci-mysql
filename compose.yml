services:
  mysql:
    container_name: mysql
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: mysql
      MYSQL_PASSWORD: replaceme # betterleaks:allow
      MYSQL_ROOT_PASSWORD: really_replaceme # betterleaks:allow
      MYSQL_DATABASE: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:z

volumes:
  mysql_data:
    driver: local
