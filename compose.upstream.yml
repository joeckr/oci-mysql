services:
  mysql:
    container_name: mysql-upstream
    image: mysql:9-oracle
    ports:
      - "3307:3306"
    environment:
      MYSQL_USER: mysql
      MYSQL_PASSWORD: replaceme # betterleaks:allow
      MYSQL_ROOT_PASSWORD: really_replaceme # betterleaks:allow
      MYSQL_DATABASE: mysql
    volumes:
      - up-mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:z

volumes:
  up-mysql_data:
    driver: local
